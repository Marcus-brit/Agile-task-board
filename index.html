<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agile Task Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main application container -->
    <main class="kanban-board">
      <!-- A single Kaban column -->
      <section class="kanban-column">
        <header class="column-header">
          <h2>TO do</h2>
        </header>

        <!-- Task Card 1 -->
        <article class="task-card">
          <span class="task-tag">Backend</span>
          <h3>Setup Database Schema</h3>
          <p>Design PostgreSQL tables for users and task</p>
        </article>

        <article class="task-card">
          <h3>Configure FastAPI Routing</h3>
          <p>Set up base REST endpoints for the task model</p>
        </article>
      </section>
    </main>
  </body>
</html>
